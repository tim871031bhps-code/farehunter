# FareHunter v1.1 — 監控路線設定（資料來源：Travelpayouts / Aviasales 快取）
defaults:
  currency: twd
  months_ahead: 10          # 監控當月起共 10 個月
  one_way: false            # false = 來回票價
  non_stop: true            # 直飛航線
  drop_pct: 25              # 低於中位數 25% 觸發
  min_history: 30           # 累積 30 筆觀察後才啟用統計規則
  pause_seconds: 0.6

routes:
  # 1. 東京成田 (TPE -> NRT)
  - origin: TPE
    destination: NRT
    absolute_threshold: 8000

  # 2. 東京羽田 (TPE -> HND)
  - origin: TPE
    destination: HND
    absolute_threshold: 9500

  # 3. 大阪關西 (TPE -> KIX)
  - origin: TPE
    destination: KIX
    absolute_threshold: 8500

  # 4. 福岡 (TPE -> FUK)
  - origin: TPE
    destination: FUK
    absolute_threshold: 8500

  # 5. 熊本 (TPE -> KMJ)
  - origin: TPE
    destination: KMJ
    absolute_threshold: 9000

  # 6. 高松 (TPE -> TAK)
  - origin: TPE
    destination: TAK
    absolute_threshold: 8500

  # 7. 青森 (TPE -> AOJ)
  - origin: TPE
    destination: AOJ
    absolute_threshold: 12000
    non_stop: false

  # 8. 高雄出發-福岡 (KHH -> FUK)
  - origin: KHH
    destination: FUK
    absolute_threshold: 9000
