# FareHunter v1.1 — 監控路線設定（資料來源：Travelpayouts / Aviasales 快取）
defaults:
  currency: twd
  months_ahead: 10          # 監控當月起共 10 個月
  one_way: false            # false = 來回票價
  non_stop: true            # 直飛航線
  drop_pct: 25              # 低於中位數 25% 觸發
  min_history: 30           # 累積 30 筆觀察後才啟用統計規則
  pause_seconds: 0.6

routes:
  # 東京 (成田 NRT / 羽田 HND)
  - origin: TPE
    destination: NRT
    absolute_threshold: 8000    # 低於此台幣金額即發送警報

  - origin: TPE
    destination: HND
    absolute_threshold: 9500

  # 福岡 (FUK)
  - origin: TPE
    destination: FUK
    absolute_threshold: 8500

  # 熊本 (KMJ)
  - origin: TPE
    destination: KMJ
    absolute_threshold: 9000

  # 高松 (TAK)
  - origin: TPE
    destination: TAK
    absolute_threshold: 8500

  # 青森 (AOJ) — 注意：轉機說明請見下方提醒
  - origin: TPE
    destination: AOJ
    absolute_threshold: 12000
    non_stop: false             # 青森多數無直飛或僅季節性包機，需設為 false 才能抓到轉機票
